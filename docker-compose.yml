services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: projectbrain-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - projectbrain_data:/var/opt/mssql

volumes:
  projectbrain_data: